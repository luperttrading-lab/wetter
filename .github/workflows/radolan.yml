name: RADOLAN Tagesregen

# Warum eine Schleife statt eines Zeitplans (20.10.2026): angemeldet war
# "5,35 * * * *", also 48 Laeufe am Tag. Gelaufen sind am 19./20.10. sechs
# (11:11, 17:43, 22:16, 01:12, 06:31, 12:04 UTC) - GitHub fuehrt "schedule"
# nur nach bestem Bemuehen aus und verwirft Termine bei Last. Die App zeigte
# deshalb meist "Radardaten fehlen · letzter Stand vor 2 h" und in der
# Regenbilanz 0 mm, obwohl RADOLAN 0,4 mm hatte.
#
# Jetzt wie solar10.yml: EIN Lauf holt selbst alle 30 Minuten (um :07 und :37,
# RW hat rund 30 min Latenz) und haelt 5,5 Stunden durch; am Ende startet er
# seinen Nachfolger per workflow_dispatch (mit GITHUB_TOKEN erlaubt). Der
# Zeitplan bleibt nur als Rueckfall, falls die Kette reisst; die
# concurrency-Gruppe sorgt dafuer, dass nie zwei Sammler nebeneinander laufen.
# Ein Abruf dauert rund 20 s. Das Repo ist oeffentlich, Laufzeit kostet nichts.

on:
  schedule:
    - cron: "17 */4 * * *"     # Rueckfall alle 4 h, falls die Kette reisst
  workflow_dispatch:           # Kette und Handstart
    inputs:
      warntest:
        description: "Zuerst eine Testnachricht aufs Handy schicken"
        type: boolean
        default: false

concurrency:
  group: radolan
  cancel-in-progress: true

permissions:
  contents: write              # radolan.json committen
  actions: write               # eigenen Nachfolger starten

jobs:
  radolan:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # GitHub erlaubt hoechstens 360 pro Job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: numpy installieren
        run: pip install --quiet numpy

      # Warnstand (welche DWD-Warnungen schon aufs Handy gingen) aus dem Zweig warn-stand
      - name: Warnstand holen
        run: |
          git fetch -q origin warn-stand 2>/dev/null && git show origin/warn-stand:stand.json > /tmp/stand.json \
            || echo '{}' > /tmp/stand.json

      - name: Testnachricht
        if: ${{ inputs.warntest }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python warnung.py --test

      # v2 (25.10.2026): Takt 15 statt 30 Minuten (:07 :22 :37 :52). RADOLAN wie bisher nur um :07/:37,
      # in JEDER Runde zusaetzlich warnung.py (DWD-Warnungen -> ntfy, siehe CLAUDE.md "Warnungen aufs Handy").
      # Der Waechter haengt hier, weil diese Schleife ohnehin rund um die Uhr laeuft - ein eigener Workflow
      # haette einen zweiten GitHub-Rechner dauerhaft belegt (Nutzer: "verbraucht das viel Energie?").
      - name: Alle 15 Minuten Warnungen, alle 30 Minuten RADOLAN
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ENDE=$(( $(date -u +%s) + 330*60 ))   # 5,5 h, mit Puffer zum Job-Limit
          RUNDE=0
          while : ; do
            RUNDE=$(( RUNDE + 1 ))
            M=$(date -u +%-M)
            echo "::group::Runde $RUNDE - $(date -u +%H:%M)Z"
            # andere Workflows committen ebenfalls auf main - vorher nachziehen
            git pull -q --rebase origin main || echo "pull fehlgeschlagen"
            # Warnungen: jede Runde
            cp /tmp/stand.json /tmp/stand.alt
            python warnung.py --stand /tmp/stand.json || echo "Warnpruefung fehlgeschlagen"
            if ! cmp -s /tmp/stand.json /tmp/stand.alt; then
              D=$(mktemp -d); cp /tmp/stand.json "$D/"
              ( cd "$D" && git init -q && git add stand.json && git commit -q -m "Warnstand" \
                && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:warn-stand ) \
                && echo "Warnstand gesichert" || echo "Warnstand sichern fehlgeschlagen"
            fi
            # RADOLAN: erste Runde und um :07/:37 (Minute mod 30 unter 15)
            if [ "$RUNDE" -eq 1 ] || [ $(( M % 30 )) -lt 15 ]; then
              python radolan_regen.py || echo "Abruf fehlgeschlagen"
              git add radolan.json radolan-archiv.json
              if git diff --staged --quiet; then
                echo "unveraendert - kein Commit"
              else
                git commit -q -m "RADOLAN Tagesregen aktualisiert"
                for i in 1 2 3 4 5; do
                  git pull -q --rebase origin main && git push -q && { echo "gepusht"; break; }
                  sleep $(( i * 5 ))
                done
              fi
            fi
            echo "::endgroup::"

            JETZT=$(date -u +%s)
            if [ "$JETZT" -ge "$ENDE" ]; then echo "Laufzeit erreicht - Ende"; break; fi
            # naechste Runde um :07, :22, :37 oder :52
            M=$(date -u +%-M); S=$(date -u +%-S); Z=7
            for Q in 7 22 37 52 67; do if [ "$M" -lt "$Q" ]; then Z=$Q; break; fi; done
            W=$(( (Z-M)*60 - S ))
            if [ $(( JETZT + W )) -ge "$ENDE" ]; then echo "naechste Runde liegt nach dem Ende - Ende"; break; fi
            sleep "$W"
          done

      # Nur nach regulaerem Ende (success). Mit always() wuerde auch ein von
      # einem neuen Lauf abgeloester (gecancelter) Lauf einen Nachfolger
      # starten - eine Kette von Sofortstarts.
      - name: Nachfolger starten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /dev/null -w "Nachfolger: HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/radolan.yml/dispatches" \
            -d '{"ref":"main"}'
