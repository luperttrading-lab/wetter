name: UV-Prognose

# Zweimal am Tag die LIVE-APP in einem headless Chromium oeffnen und die Zahlen
# der Kachel "UV heute" auslesen (uv_prognose.py): morgens die Erwartung fuer
# heute, abends das Gemessene und die Erwartung fuer morgen. Nach ein paar
# Wochen zeigt uv_prognose_log.json (Feld _auswertung), ob "erw." im Schnitt
# stimmt. Sommer-/Winterzeit: die Skriptlogik nimmt die Ortszeit, der Cron
# liegt so, dass beide Zeiten morgens vor 12 und abends nach Sonnenuntergang
# landen.

# Seit 20.10.2026: GitHub startet geplante Laeufe oft 3-5 h zu spaet. Darum
# je drei Laeufe pro Fenster; das Skript prueft am SONNENSTAND, ob ein Lauf
# gueltig ist (morgens bis 2 h nach Aufgang, abends ab 1 h vor Untergang bis
# Mitternacht), und traegt ausserhalb nichts ein. Nicht auf :00/:05 legen -
# zu diesen Minuten ist GitHub am vollsten.
on:
  schedule:
    - cron: "37 22 * * *"    # 00:37 Sommerzeit / 23:37 Winterzeit (Winter: verfaellt)
    - cron: "37 0 * * *"     # 02:37 / 01:37
    - cron: "37 2 * * *"     # 04:37 / 03:37
    - cron: "43 16 * * *"    # 18:43 / 17:43 (nur Herbst/Winter im Fenster)
    - cron: "43 18 * * *"    # 20:43 / 19:43
    - cron: "43 19 * * *"    # 21:43 / 20:43
  workflow_dispatch:
    inputs:
      modus:
        description: "morgens oder abends erzwingen (leer = nach Sonnenstand; erzwungen ausserhalb des Fensters = als ungueltig markiert)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: uv-prognose
  cancel-in-progress: false

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright und Chromium installieren
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: App auslesen
        env:
          MODUS: ${{ inputs.modus }}
        run: python uv_prognose.py $MODUS

      - name: Log committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv_prognose_log.json
          git diff --staged --quiet || git commit -m "UV-Prognose $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
