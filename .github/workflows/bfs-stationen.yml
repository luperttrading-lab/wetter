name: BfS-Stationsliste holen

# Liest Slugs, Namen, Koordinaten und Hoehen aller UV-Messstationen von den
# BfS-Seiten und schreibt bfs-stationen.json. Die Slugs sind nicht zu erraten
# ("Boesel_B", "Belm-Osnabrueck"), deshalb werden sie ausgelesen statt getippt.
# Die Liste aendert sich selten — einmal im Monat genuegt.

on:
  schedule:
    - cron: "20 4 1 * *"     # am 1. jeden Monats um 04:20 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stationen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stationsliste auslesen
        run: python bfs_stationen.py

      - name: bfs-stationen.json committen (nur bei Aenderung)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bfs-stationen.json
          git diff --staged --quiet || git commit -m "BfS-Stationsliste aktualisiert"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
