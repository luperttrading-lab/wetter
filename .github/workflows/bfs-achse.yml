name: BfS-Achse auslesen

# Liest die Y-Skala der amtlichen BfS-UV-Grafiken aus (0-6, 0-8 ...) und
# schreibt sie in bfs-achse.json. Die App braucht die Skala, um ihre Kurven
# richtig ins Bild zu legen — im Browser ist sie nicht auslesbar (CORS).
# Das BfS aktualisiert die Bilder alle paar Minuten; die Skala aendert sich
# aber hoechstens einmal am Tag. Zwei Laeufe je Stunde reichen.

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  achse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: pip install --quiet pillow

      - name: Achsen auslesen
        run: python bfs_achse.py

      - name: bfs-achse.json committen (nur bei Aenderung)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bfs-achse.json
          git diff --staged --quiet || git commit -m "BfS-Achse aktualisiert"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
