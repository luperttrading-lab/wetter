name: DWD Solar 10-Minuten

# Holt die 10-Minuten-Strahlungswerte ALLER DWD-Stationen mit Strahlungs-
# messung (rund 60) und veroeffentlicht sie im Branch "daten" - OHNE Historie:
# jeder Lauf ersetzt den einzigen Commit dort. Die App liest die Dateien ueber
# raw.githubusercontent.com (CORS offen, 5 Minuten Cache) und sucht sich beim
# Ortswechsel die naechste Station.
# Der DWD aktualisiert die now-Dateien etwa alle 30 Minuten mit rund 25 Minuten
# Latenz; ein Lauf alle 15 Minuten faengt jede Aktualisierung zeitnah. Nachts
# (UV = 0) laeuft nichts. Minuten versetzt zu RADOLAN (:05/:35) und BfS-Achse
# (:12/:42).

on:
  schedule:
    - cron: "8,23,38,53 4-20 * * *"   # UTC = 06-22 Uhr MESZ
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solar10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bisherigen Stand aus Branch daten holen (fuer "gestern")
        run: |
          mkdir -p alt
          if git fetch --depth 1 origin daten 2>/dev/null; then
            git archive origin/daten solar10 | tar -x -C alt
            echo "alter Stand: $(ls alt/solar10 | wc -l) Dateien"
          else
            echo "noch kein Branch daten"
          fi

      - name: 10-Minuten-Werte holen
        run: python solar10.py --alt alt/solar10 --out daten/solar10

      - name: In Branch daten veroeffentlichen (ohne Historie)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd daten
          git init -q -b daten
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Solar 10-min $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" daten
