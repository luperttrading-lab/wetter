<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wochenende — Varianten</title>
<style>
/* Vergleichsseite (20.10.2026): wie markiert die Kachel "16 Tage" das
   Wochenende? Kachelmasse wie in der App (v5.19): Kachelraster bei 375 pt
   305 px breit (Seite minus 70 px), Grafik links 8 / rechts 13 / oben 25 /
   unten 7 px, je Tag eine Spalte. */
:root{--ink:#17202e;--muted:#5c6b80;--line:#e7dfd4;--bg:#fbf6ee;--ki:rgba(255,255,255,.72);--karte:#fffdf9}
html.dunkel{--ink:#e7edf5;--muted:#9aa7b8;--line:#33405a;--bg:#121821;--ki:rgba(255,255,255,.07);--karte:#1a212c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:16px 0 calc(28px + env(safe-area-inset-bottom))}
.rand{padding:0 16px}
h1{font-size:20px;margin:4px 0 2px}
.info{font-size:13px;color:var(--muted);margin:0 0 8px}
.knoepfe{display:flex;gap:8px;margin:6px 0 2px}
.knoepfe button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--karte);color:var(--ink);border-radius:10px;padding:7px 12px}
.knoepfe button.an{background:#1e293b;color:#fff;border-color:#1e293b}
.vari{margin:18px auto 0;width:calc(100vw - 70px)}
.vari h2{font-size:15px;margin:0}
.vari p{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.kz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ki{background:var(--ki);border:1px solid var(--line);border-radius:13px;padding:8px 7px 7px 8px;position:relative;height:61px;line-height:1.3;min-width:0}
.l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden}
.v{font-size:14.5px;font-weight:800;margin-top:2px;white-space:nowrap}
.s{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap}
.gross{grid-template-columns:2fr 1fr;margin-top:8px}
.gross .ki{height:122px}
.gross .l{font-size:21px}
.gross .bal{top:50px;left:16px;right:26px;bottom:14px}
/* Grafik */
.bal{position:absolute;left:8px;right:13px;top:25px;bottom:7px;border-radius:4px;overflow:hidden}
.bb{position:absolute;inset:0;display:flex;gap:1px;padding:0 1px}
.bb b{flex:1 1 0;min-width:1px;height:100%;display:flex;align-items:flex-end}
.bb b>i{flex:1 1 auto;background:#3a8fd8;border-radius:1px 1px 0 0}
.bb b>i.tr{height:1px;background:rgba(92,107,128,.35)}
.bb b.un>i{opacity:.4}
.bb b.ab{box-shadow:-1px 0 0 rgba(40,56,90,.45)}
html.dunkel .bb b.ab{box-shadow:-1px 0 0 rgba(255,255,255,.35)}
.mitzeile .bb b{padding-bottom:8px}
.gross .mitzeile .bb b{padding-bottom:16px}
.we-grau .bb b.we{background:rgba(45,70,150,.12)}
html.dunkel .we-grau .bb b.we{background:rgba(120,150,230,.16)}
.we-rot .bb b.we{background:rgba(220,50,50,.14)}
html.dunkel .we-rot .bb b.we{background:rgba(255,90,90,.20)}
.we-strich .bb b.we{box-shadow:inset 0 -2px 0 #d33a3a}
.we-strich .bb b.we.ab{box-shadow:inset 0 -2px 0 #d33a3a,-1px 0 0 rgba(40,56,90,.45)}
.gross .we-strich .bb b.we{box-shadow:inset 0 -4px 0 #d33a3a}
.wt{position:absolute;bottom:0;line-height:8px;font-weight:700;color:var(--muted);text-align:center;white-space:nowrap;z-index:1}
.gross .wt{line-height:16px}
.wt.rot{color:#c93434}
html.dunkel .wt.rot{color:#ff8a8a}
.leg{position:absolute;top:1px;right:1px;font-size:7px;line-height:8px;font-weight:700;color:var(--muted);z-index:2;display:flex;align-items:center;gap:2px;
  background:var(--karte);padding:0 2px;border-radius:3px}
.gross .leg{font-size:14px;line-height:16px;gap:4px;padding:0 4px}
.leg i{display:inline-block;width:6px;height:6px;border-radius:1px;background:rgba(220,50,50,.45)}
.gross .leg i{width:12px;height:12px}
.leg i.strich{height:2px;background:#d33a3a}
.gross .leg i.strich{height:4px}
.dots{position:absolute;top:50%;right:2px;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.3}.dots i.an{opacity:1}
.gross .dots{display:none}
</style>
</head>
<body>
<div class="rand">
<h1>Wochenende in der Kachel „16 Tage“</h1>
<p class="info" id="info">Lade Regen der nächsten 16 Tage …</p>
<div class="knoepfe" id="hd"><button type="button" data-m="hell" class="an">Hell</button><button type="button" data-m="dunkel">Dunkel</button></div>
</div>
<div id="liste"></div>

<script>
"use strict";
/* Beispiel, falls der Abruf scheitert: Wettenberg, Stand 20.10.2026 22 Uhr */
let TAGE=[0.9,2.9,1.43,2.5,0.6,6.75,0.9,3,0,0,0,0.6,0,0.6,12.6,5.1].map((mm,i)=>{const d=new Date(2026,9,20+i,12);return {d,mm};});
const dunkel=()=>document.documentElement.classList.contains("dunkel");

/* Varianten: k Kennung, kl Klassen am Streifen, zeile = unten Platz fuer Text,
   txt(gruppe) liefert den Text unter dem Wochenende, leg = Legende oben rechts */
const V=[
 {k:"A",t:"Wie jetzt (v5.19)",p:"Grau hinterlegt, darunter „Sa So“ in 7 px.",kl:"we-grau mitzeile",fs:7,txt:g=>g.map(d=>d===6?"Sa":"So").join(" ")},
 {k:"B",t:"Noch kleiner",p:"Wie A, Schrift 6 px.",kl:"we-grau mitzeile",fs:6,txt:g=>g.map(d=>d===6?"Sa":"So").join(" ")},
 {k:"C",t:"Rot hinterlegt + Legende",p:"Kein Text unter den Säulen, dafür oben rechts ein Kästchen „Sa/So“. Säulen wieder volle Höhe.",kl:"we-rot",leg:'<i></i>Sa/So'},
 {k:"D",t:"Roter Strich wie im Kalender",p:"Unter Samstag und Sonntag ein roter Strich an der Grundlinie, oben rechts die Legende. Hintergrund bleibt ruhig.",kl:"we-strich",leg:'<i class="strich"></i>Sa/So'},
 {k:"E",t:"Rot hinterlegt + rotes „Sa So“",p:"Wie C, aber statt Legende steht „Sa So“ in Rot direkt darunter.",kl:"we-rot mitzeile",fs:7,rot:true,txt:g=>g.map(d=>d===6?"Sa":"So").join(" ")},
 {k:"F",t:"Ohne Wochenende",p:"Nur Säulen. Die erste ist heute; wer die Tage braucht, tippt und landet in der 16-Tage-Liste.",kl:""},
];
function grafik(v,gross){
  const n=TAGE.length,zeile=/mitzeile/.test(v.kl),H=(zeile?20:27)*(gross?2:1),
    cols=TAGE.map((x,i)=>{const wd=x.d.getDay(),c=[(wd===0||wd===6)?"we":"",i>=7?"un":"",i===7?"ab":""].filter(Boolean).join(" ");
      const bar=x.mm>=0.1?`<i style="height:${Math.max(2,Math.round(Math.min(1,x.mm/10)*H))}px"></i>`:`<i class="tr"></i>`;
      return `<b${c?` class="${c}"`:""}>${bar}</b>`;}).join("");
  let wt="";
  if(v.txt){const wd=TAGE.map(x=>x.d.getDay()),gr=[];
    wd.forEach((d,i)=>{if(d!==0&&d!==6)return;const g=gr[gr.length-1];if(g&&g[1]===i-1)g[1]=i;else gr.push([i,i]);});
    const f=gross?2:1;
    wt=gr.map(([a,b])=>{const t=v.txt(wd.slice(a,b+1)),w=(b>a?(v.fs===6?19:22):(v.fs===6?9:10))*f,c=(a+b+1)/2/n*100;
      return `<b class="wt${v.rot?" rot":""}" style="font-size:${v.fs*f}px;width:${w}px;left:clamp(0px,calc(${c.toFixed(2)}% - ${w/2}px),calc(100% - ${w}px))">${t}</b>`;}).join("");}
  const leg=v.leg?`<span class="leg">${v.leg}</span>`:"";
  return `<span class="bal ${v.kl}"><span class="bb">${cols}</span>${wt}${leg}</span>`;
}
function zeichnen(){
  const sum=TAGE.slice(0,7).reduce((a,x)=>a+x.mm,0);
  document.getElementById("liste").innerHTML=V.map(v=>`<div class="vari"><h2>${v.k} · ${v.t}</h2><p>${v.p}</p>
    <div class="kz"><div class="ki"><div class="l">Luft</div><div class="v">37 gut</div><div class="s">PM2.5</div></div>
      <div class="ki"><div class="dots"><i></i><i class="an"></i></div><div class="l">16 Tage</div>${grafik(v,false)}</div>
      <div class="ki"><div class="l">7 Tage</div><div class="v">${sum.toFixed(1).replace(".",",")} mm</div><div class="s">erste Ansicht</div></div></div>
    <div class="kz gross"><div class="ki"><div class="l">16 Tage (2×)</div>${grafik(v,true)}</div></div></div>`).join("");
}
document.getElementById("hd").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.documentElement.classList.toggle("dunkel",b.dataset.m==="dunkel");
  document.querySelectorAll("#hd button").forEach(x=>x.classList.toggle("an",x===b));zeichnen();});
zeichnen();
/* echte Daten fuer Wettenberg (oder ?lat=..&lon=..) */
(async()=>{const u=new URLSearchParams(location.search),la=u.get("lat")||"50.6481",lo=u.get("lon")||"8.6743",info=document.getElementById("info");
  try{const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=precipitation_sum&forecast_days=16&timezone=Europe%2FBerlin`)).json();
    TAGE=j.daily.time.map((t,i)=>({d:new Date(t+"T12:00"),mm:+j.daily.precipitation_sum[i]||0}));
    info.textContent=`Echter Regen der nächsten 16 Tage (Open-Meteo, ${la}/${lo}). Die ersten 7 Tage kräftig, ab Tag 8 blass. Oben jeweils Originalgröße, darunter doppelt.`;
  }catch(e){info.textContent="Abruf fehlgeschlagen – Beispieldaten vom 20.10.2026. Oben jeweils Originalgröße, darunter doppelt.";}
  zeichnen();})();
</script>
</body>
</html>
